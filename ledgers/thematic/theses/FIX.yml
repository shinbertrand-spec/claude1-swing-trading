# NO position exists or is proposed. Operator owns entries and sizing.

ticker: FIX              # Comfort Systems USA — electrical & mechanical
status: candidate        # construction, modular/prefab, DC-heavy
created_at: "2026-08-09"

# THESIS REWRITTEN 2026-08-19 (nomination-standard pass, post-UNPROVEN
# downgrade): the labour-SHORTAGE mechanism cannot be stated with a quantity
# that survives BLS (no crisis signature; T6 armed and disconfirming). What
# survives the standard is a BACKLOG thesis, so per the operator's rule it is
# rewritten as one. Original (2026-08-09) labour-bound sentence preserved in
# verify_log for the record.
thesis: >
  Comfort Systems converts its $11.94B contracted backlog (+99.3% YoY,
  2025-12-31; +93.2pp of that organic) at the elevated gross margins
  embedded in fixed-price contracts signed in the 2024-25 seller's market
  — a NEAR-TERM TIMING claim: contracted work, with hyperscaler
  signed-but-not-commenced leases upstream of it, converts over the next
  ~6-12 months at booked economics even as new-bookings growth
  decelerates to the consensus path (~+25% 2027, ~+6% 2028).

# Nomination-standard mechanism (one sentence, with a quantity):
# "FIX's next ~9-12 months of revenue is already contracted — $11.94B of
# fixed-price backlog (+99.3% YoY, 93.2pp of it organic) booked at the
# 2024-25 vintage's elevated margins against a ~$13B annualized run-rate —
# so near-term margin is set by contract vintage at execution, not by the
# booking-cycle deceleration the multiple prices."
#
# 🔴 CORRECTED 2026-08-19: the 2026-08-19 first draft of this mechanism
# claimed "~1.5 years of revenue already sold" and the word "legally
# committed". BOTH are contradicted by the company's own FY2025 10-K:
# backlog "represents revenue that is likely to be reflected in our
# operating results over the next SIX TO TWELVE MONTHS" and "project work
# generally lasts less than one year"; and backlog is "contracted or
# committed" work explicitly "subject to unexpected adjustments and
# cancellations" (see backlog_terms below). The claim is corrected here,
# not defended.

layer: skilled_labor     # stack-map.yml layer of record — but NOTE (2026-08-19):
                         # after the rewrite the mechanism is CONTRACTUAL
                         # (backlog vintage), not scarcity. The thesis therefore
                         # survives the layer's UNPROVEN tightness — the
                         # layer-fit rule ("constraint left the layer = thesis
                         # wrong") applies to scarcity theses, and this no
                         # longer is one. Labour scarcity is demoted to
                         # unpriced upside; T6 (BLS) still armed as the honest
                         # test of that demoted leg.

value_capture:
  who_pays: >
    Hyperscalers + DC developers on compressed schedules, via fixed-price
    E&M contracts signed in a seller's market (tech = 45% of FY2025 revenue,
    up from 33%) and via FIX's own modular/prefab capacity, which monetizes
    the SOLUTION to the labor scarcity, not only the scarce hours.
  why_not_competed_away: >
    The input cannot be manufactured quickly: state-regulated 4-5 year
    licensure gates new supply of electricians regardless of wage offered
    (applications +70% 2022-24 changes nothing before 2028). Incumbent
    contractor scale (existing licensed workforce + hyperscaler qualification
    + bonding capacity) is the entry barrier between here and there.
  moat_duration_expected: >
    Through ~2028-2030 (first big licensure cohorts land). NOT indefinite —
    this is a dated scarcity, and the thesis dies on schedule even if
    nothing else kills it first.

market_error:
  what_consensus_gets_wrong: >
    Contractors are priced on a late-cycle heuristic: capex growth
    decelerates → bookings peak → margins mean-revert. The claim here is
    DURATION, not level: (a) $11.94B of legally committed backlog (+99% YoY)
    and ~$662B of hyperscaler leases signed-but-not-commenced sit UPSTREAM
    of any new-bookings deceleration; (b) near-term margin is set by
    CONTRACT VINTAGE at execution time — fixed-price terms booked in the
    2024-25 seller's market — not by capex growth at booking time.
    (Rewritten 2026-08-19: the prior (b) claimed margin was set by labor
    scarcity at execution — that mechanism is UNPROVEN per BLS and is
    demoted; see verify_log.)
  why_the_error_persists: >
    Seventy years of construction-cyclicality priors; the off-balance-sheet
    lease pipeline (GAAP recognizes at commencement) is invisible to the
    backlog-growth heuristic most models run on.
  when_bottleneck_became_consensus: "mid-2026 (labor as site-selection constraint enters mainstream coverage ~Jul-2026)"

  # ---------------------------------------------------------------------
  # BACKLOG TERMS — added 2026-08-19 (operator: "legally committed" is the
  # thesis's load-bearing word; state the actual terms and the prior-shock
  # behaviour). Source: FY2025 10-K (filed 2026-02-19) + FY2020 10-K
  # (filed 2021-02-25), both read in primary this date.
  # ---------------------------------------------------------------------
  backlog_terms:
    what_the_company_actually_says: >
      VERBATIM risk-factor heading, FY2025 10-K: "Our backlog is subject
      to unexpected adjustments and cancellations, which means that
      amounts included in our backlog may not result in actual revenue or
      translate into profits." Definition: "Backlog reflects revenue still
      to be recognized under contracted or committed installation and
      replacement project work" — and "Projects may remain in our backlog
      for an extended period of time, or project cancellations or scope
      adjustments may occur with respect to contracts reflected in our
      backlog."
    verdict_on_the_word: >
      "LEGALLY COMMITTED" IS NOT SUPPORTED and has been removed from the
      thesis sentence. The disclosed terms are "contracted or committed"
      work that is cancellable and scope-adjustable at the customer's
      instance; no cancellation-fee, take-or-pay, or termination-payment
      schedule is disclosed anywhere in the 10-K. The thesis rests on
      customers' CONTINUED INTENT plus switching costs, not on a legal
      lock. This is the single largest weakening found in the file to
      date.
    duration_disclosed: >
      "Project work generally lasts less than one year"; backlog
      "represents revenue that is likely to be reflected in our operating
      results over the next six to twelve months" (identical language in
      the FY2020 and FY2025 10-Ks — not a megaproject-era change).
    prior_demand_shock_COVID_2020: >
      THE TEST CASE, and it is adverse: FY2020 backlog fell to $1.51B
      from $1.60B — headline only −5.6% — but the SAME-STORE backlog
      decline was **−23.4% YoY**, "broad-based", with the headline
      cushioned by three acquisitions (TAS $164.3M, T E C $72.8M, NC
      electrical $47.4M). Read: in a real demand shock, organic
      contracted backlog contracted by roughly a quarter within a year,
      and M&A masked it in the reported number. A −23.4% organic
      repeat from $11.94B is ~$2.8B of backlog, versus the T1
      invalidation line at $10.5B (−12%) — i.e. **a COVID-magnitude
      shock breaches T1 with room to spare**, which is the honest
      calibration of that trigger.
    why_this_matters_now: >
      The keystone event currently blocking entry IS a datacentre pause
      (2026-08-03 Texas compliance gate + the 2026-08-11 EIA load-growth
      cut). The thesis's load-bearing asset is cancellable backlog whose
      end-market is the thing being paused, and the one historical
      analogue shows organic backlog −23.4% in a shock. The
      keystone-monitor flag on this thesis is therefore not procedural —
      it is aimed at exactly the mechanism.

  backlog_composition:   # added 2026-08-19 (operator: split +99% organic vs acquired)
    total: "$11.944B at 2025-12-31 vs $5.994B at 2024-12-31 = +99.3% YoY"
    acquired_component: >
      ~$361.2M of the increase, ≈6.0pp of the 99.3% — Right Way
      ($106.2M), Century ($91.6M), Feyen Zylstra ($90.9M), Meisner
      ($72.5M).
    organic_component: "same-store increase $5.59B, +93.2% (the company's own figure)"
    reading: >
      The growth is OVERWHELMINGLY ORGANIC — recorded because it cuts
      FOR the thesis and the file should carry favourable findings with
      the same discipline as adverse ones. It removes the "serial
      acquirer buying its backlog" objection for FY2025 (unlike FY2020,
      where acquisitions masked an organic decline — see above). It does
      NOT address cancellability, which is the separate and larger
      weakness.
    segment_split: "Mechanical $9.03B (75.6%) / Electrical $2.92B (24.4%)"
  when_price_moved: >
    2024-2026, substantially: FIX ~5x off its 52-week low ($276→$1,500 range
    per Mar-2026; $1,694.55 at thesis creation = ~46x FY26 consensus EPS
    $36.76 vs 22.7x five-year median forward multiple). The story is
    SUBSTANTIALLY PRICED — the residual edge, if any, is duration. Honest
    corollary: this is a candidate for operator consideration on serious
    pullbacks, not a pound-the-table entry at reference price.

