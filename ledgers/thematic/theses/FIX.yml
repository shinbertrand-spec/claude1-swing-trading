# Worked thesis #1 — Phase 1 proof-of-shape (ai-stack-analyst)
# Reference price at creation: $1,694.55 (2026-08-07 close, data_cache).
# NO position exists or is proposed. Operator owns entries and sizing.

ticker: FIX              # Comfort Systems USA — electrical & mechanical
status: candidate        # construction, modular/prefab, DC-heavy
created_at: "2026-08-09"

thesis: >
  US datacenter electrical/mechanical construction capacity stays labor-bound
  through at least 2028 — because journeyman-electrician cohorts that began
  apprenticeships in 2024-25 cannot reach licensure before 2028-2030 while
  ~30% of the incumbent union workforce is at or near retirement — so Comfort
  Systems converts its committed backlog at sustained-or-better gross margins
  even if new AI capex growth decelerates to the consensus path
  (~+25% 2027, ~+6% 2028).

layer: skilled_labor     # stack-map.yml — v2 (2026-08-18): DOWNGRADED to
                         # UNPROVEN. BLS primary shows no crisis signature;
                         # the licensure clock remains a legal fact but the
                         # crisis-magnitude claims are unconfirmed (T6 armed).

value_capture:
  who_pays: >
    Hyperscalers + DC developers on compressed schedules, via fixed-price
    E&M contracts signed in a seller's market (tech = 45% of FY2025 revenue,
    up from 33%) and via FIX's own modular/prefab capacity, which monetizes
    the SOLUTION to the labor scarcity, not only the scarce hours.
  why_not_competed_away: >
    The input cannot be manufactured quickly: state-regulated 4-5 year
    licensure gates new supply of electricians regardless of wage offered
    (applications +70% 2022-24 changes nothing before 2028). Incumbent
    contractor scale (existing licensed workforce + hyperscaler qualification
    + bonding capacity) is the entry barrier between here and there.
  moat_duration_expected: >
    Through ~2028-2030 (first big licensure cohorts land). NOT indefinite —
    this is a dated scarcity, and the thesis dies on schedule even if
    nothing else kills it first.

market_error:
  what_consensus_gets_wrong: >
    Contractors are priced on a late-cycle heuristic: capex growth
    decelerates → bookings peak → margins mean-revert. The claim here is
    DURATION, not level: (a) $11.94B of legally committed backlog (+99% YoY)
    and ~$662B of hyperscaler leases signed-but-not-commenced sit UPSTREAM
    of any new-bookings deceleration; (b) margin is set by labor scarcity at
    EXECUTION time, not by capex growth at booking time — and the labor
    clock is fixed by licensure law through 2028.
  why_the_error_persists: >
    Seventy years of construction-cyclicality priors; the off-balance-sheet
    lease pipeline (GAAP recognizes at commencement) is invisible to the
    backlog-growth heuristic most models run on.
  when_bottleneck_became_consensus: "mid-2026 (labor as site-selection constraint enters mainstream coverage ~Jul-2026)"
  when_price_moved: >
    2024-2026, substantially: FIX ~5x off its 52-week low ($276→$1,500 range
    per Mar-2026; $1,694.55 at thesis creation = ~46x FY26 consensus EPS
    $36.76 vs 22.7x five-year median forward multiple). The story is
    SUBSTANTIALLY PRICED — the residual edge, if any, is duration. Honest
    corollary: this is a candidate for operator consideration on serious
    pullbacks, not a pound-the-table entry at reference price.

