  - date: "2026-08-19"
    searched_for_refutation:
      - "backlog cancellation/deferral TERMS in primary (FY2025 10-K, filed 2026-02-19) — is 'legally committed' supportable?"
      - "prior demand-shock behaviour of this company's backlog (FY2020 10-K, COVID)"
      - "organic vs acquired decomposition of the +99% (FY2025 10-K MD&A)"
      - "duration: how long does backlog actually take to convert (both 10-Ks)"
    found: >
      Three adverse, one favourable, and one correction to my own prior
      wording. ADVERSE: (1) "legally committed" is NOT supportable —
      the company's own risk factor says backlog "is subject to
      unexpected adjustments and cancellations" and "may not result in
      actual revenue"; no cancellation-fee or take-or-pay schedule is
      disclosed. The word is removed. (2) In the one available demand
      shock (COVID FY2020), SAME-STORE backlog fell −23.4% YoY while the
      headline showed only −5.6%, cushioned by three acquisitions — a
      repeat of that magnitude from $11.94B lands ~$2.8B below today and
      breaches the T1 line ($10.5B) comfortably. (3) The keystone event
      currently blocking entry is itself a datacentre pause, i.e. aimed
      at exactly this mechanism. FAVOURABLE: (4) the +99.3% is
      overwhelmingly ORGANIC — acquisitions contributed ~$361.2M (≈6.0pp);
      same-store +93.2% — which removes the "bought its backlog"
      objection for FY2025 (notably the reverse of FY2020). CORRECTION:
      (5) my 2026-08-19 first-draft mechanism claimed "~1.5 years of
      revenue already sold"; the company says backlog converts over "six
      to twelve months" and "project work generally lasts less than one
      year" — corrected in place, not defended. Also closed early: the
      08-31 concentration pull — one customer = 12.8% of 2025 revenue.
    verdict: >
      weakened further, and still a candidate. The mechanism survives as
      a ~6-12-month conversion claim inside an ~18-month timing thesis,
      but its load-bearing word is downgraded from "legally committed" to
      "contracted and cancellable", and the one historical shock analogue
      is materially adverse. Entry remains blocked (concentration watch +
      keystone firing); covered tier, ~5% ceiling, no override. The file
      is now honest about being a timing trade on a cancellable book,
      which is a smaller and more defensible claim than the one it
      started with on 2026-08-09.
