horizon:
  # 🔴 RESTATED 2026-08-19 (operator: record the horizon explicitly).
  expected_years: "~1.5 (≈18 months) — NOT 2-4; the prior '2-4' is retired"
  what_this_thesis_is: >
    AN ~18-MONTH TIMING THESIS ON A MISPRICED DECELERATION, not a
    long-term commitment and not a compounder hold. The claim is that
    the market prices a booking-cycle slowdown into a company whose
    next ~6-12 months of revenue is already contracted at prior-vintage
    margins; the mispricing, if it exists, resolves as those contracts
    convert. Once the 2024-25 vintage has run off, the thesis has
    NOTHING left to say — it does not roll forward on its own.
  margin_is_peak_vintage: >
    STATED EXPLICITLY: >25% gross margin is a PEAK-VINTAGE figure and
    reverts. Company-reported full-year gross margin went 21.0% (2024)
    → 24.1% (2025); the >25% print was a quarterly high, achieved in
    the most favourable pricing environment the company has recorded.
    The thesis does NOT assume that margin persists — it assumes the
    already-signed vintage converts at its booked economics before
    reversion shows up in new bookings. Any version of this thesis that
    needs >25% to CONTINUE is a different, weaker thesis and is not
    this one.
  what_makes_it_shorter: >
    T3 firing (early labor unlock); T5 displacement; a hyperscaler capex
    PAUSE (not deceleration — a pause) which converts backlog duration into
    cancellation negotiations; margin peak confirmed by T2.

