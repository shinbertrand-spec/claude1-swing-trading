    quarterly re-verification would then attack), then obtain written
    operator sign-off. Sits inside the ~14%-of-portfolio thematic
    envelope (rules.yml sizing.envelope).

entry_triggers:          # rules.yml R1 (retrofit 2026-08-18) — symmetric with
  attention_proxy: >     # invalidation triggers; answers when rebuy flips YES.
    Finviz news-item count for FIX over the trailing 30 days, compared to
    its trailing-12-month monthly average (observable via the project's
    existing news tooling; chosen 2026-08-18, held stable for the life of
    this thesis).
  triggers:
    - id: E1_cold_rebuy
      rebuy_flip: >
        Forward P/E <= 30x current-fiscal-year consensus EPS (~$1,100 at
        FY26 consensus $36.76). Basis: above the 22.7x own-history median
        (a real structural story may carry some premium) but below the
        zone where the verify_log's "price late" objection dominates; at
        <=30x the 2026-08-09 rebuy answer flips from NO toward YES,
        subject to the cold components below.
      price_run_component: "COLD required: trailing 6-month total return <= SPY AND <= XLI (sector). A drawdown that leaves FIX still outrunning its sector is not cold."
      attention_component: "COLD required: 30-day news count at or below the trailing-12-month monthly average."
      precondition: >
        BLOCKING (R1): all disqualifier_check cells must read pass.
        UPDATE 2026-08-18 (clearing plan executed): dilutive-raise, SEC
        investigation, and sector-trend all CLOSED as pass via EDGAR +
        XLI computation; the remaining blockers are (a) the
        customer-concentration `watch` — operator risk-acceptance at
        entry consideration — and (b) the unresolved keystone channel-C
        firing (Texas/EIA, 2026-08-11). Plus: no invalidation trigger
        (T1-T6) fired. E1 still cannot fire today; that is the design
        working.
      source: "consensus EPS + price (data_cache); finviz news counts; SPY/XLI total returns"
      cadence: quarterly (with the rebuy test) + event-driven on drawdowns
      next_check: "2026-11-09"

invalidation_triggers:   # written before any position; ANY firing -> escalate
  - id: T1_backlog
    trigger: "Total backlog prints below $10.5B (−12% from the $11.94B 2025-12-31 peak) for TWO consecutive quarters — the committed-duration leg dies."
    source: "FIX 10-Q / earnings release, backlog disclosure"
    cadence: quarterly
    next_check: "2026-10-31"
  - id: T2_margin
    trigger: "Gross margin compresses >150bps YoY for TWO consecutive quarters (from the >25% Q4-2025 level) — labor-scarcity pricing power is broken regardless of the story."
    source: "FIX 10-Q income statement"
    cadence: quarterly
    next_check: "2026-10-31"
  - id: T3_labor_unlock
    trigger: "US registered-apprenticeship ELECTRICIAN completions run-rate exceeds ~45K/yr, or a state-level licensure-reciprocity/fast-track wave is enacted in >=3 major DC states — the pipeline unblocks ahead of the 2028 schedule."
    source: "DOL RAPIDS apprenticeship data (annual) + IBEW/IEC cohort reporting + state legislation trackers"
    cadence: annual (January) + event-driven
    next_check: "2027-01-31"
  - id: T4_demand_duration
    trigger: "Hyperscaler signed-but-not-commenced lease commitments fall below ~$400B (from ~$662B, Moody's early-2026) — the upstream demand pipe that outlasts capex deceleration is draining."
    source: "Moody's / hyperscaler 10-K lease-commitment footnotes"
    cadence: semiannual
    next_check: "2027-02-09"
  - id: T5_displacement
    trigger: "FIX technology-segment book-to-bill < 1.0 for TWO consecutive quarters WHILE hyperscaler capex is still growing — prefab/self-perform displacement (the adversarial pass's strongest counterforce) is taking the work."
    source: "FIX 10-Q segment disclosure vs hyperscaler capex prints"
    cadence: quarterly
    next_check: "2026-10-31"
  - id: T6_bls_wage        # armed 2026-08-18 per audit §1.3 / handoff §4.3 —
    trigger: >             # public, cadenced, and CURRENTLY DISCONFIRMING.
      The next annual BLS OEWS release (spring 2027, May-2026 data) again
      shows NO crisis signature: electrician median wage growth at or
      below the all-construction-trades median AND employment/openings in
      line with the +9%/decade projection (2026-08-18 baseline: 818,700
      electricians, ~81K openings/yr, median $62,350 — no scarcity
      premium). Two consecutive disconfirming years -> the labor-scarcity
      premise is refuted AT SOURCE; the thesis leg fails regardless of
      FIX's own financials.
    source: "BLS OEWS (annual, ~Mar-Apr release) + BLS OOH electrician projections"
    cadence: annual + event-driven on any BLS special release
    next_check: "2027-04-30"

