sizing_inputs:           # rules.yml §sizing — inputs only; operator sizes
  downside_vs_benchmark_scenario: >
    Thesis+stop failure mode: hyperscaler capex PAUSE converts committed
    backlog into cancellation negotiations while the ~46x multiple
    mean-reverts toward the 22.7x own-history median — a plausible −50%
    single-name move vs flat SPY (the 2026-02..04 drawdown was −40% class
    without a thesis break).
  ten_point_test: >
    At the ~10% anchor, a −50% name move costs the book ~5pp vs benchmark
    — inside the ten-point line ONLY if the rest of the book is not the
    same bet. Per rules.yml correlation_note the whole AI-stack book is
    ONE group for this test until the keystone monitor says otherwise: a
    common-mode capex roll hitting every position at once is the binding
    scenario, not FIX alone. RESOLVED 2026-08-18 (rules.yml
    sizing.group_cap + envelope): total thematic exposure capped at ~14%
    of portfolio (= 10pp / the DERIVED −70% bust-cohort common-mode
    drawdown, superseding the initial −50% assumption); FIX additionally
    sits under the R3 half-anchor ceiling (~5%, no override while the
    edge claim reads "none documented").

