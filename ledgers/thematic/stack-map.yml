# AI-buildout stack map — v2 (Phase 2, 2026-08-18; v1 2026-08-09)
# Structural model of the AI buildout by layer: who holds the constraint,
# how tight, what loosens it, evidence + date. NOT a ticker list.
# v2: corrections from the 2026-08-18 evidence audit (vault,
# wiki/notes/2026-08-18-thematic-conviction-book-evidence-audit.md) —
# memory/packaging/litho re-called, labour BINDING->UNPROVEN, category
# errors purged (rare earths, HVDC, GOES, copper, nuclear), re_rating_status
# added per layer, migration forecasting REMOVED (the map locates, it does
# not predict).
# Distinct from the AI-thematic SWING track (frozen universes, hold:true) —
# no gate profiles, no trials, no universes shared. trials.yml untouched (103).
#
# claim_status vocabulary (literature rule #4 — never launder a summary
# into a citation):
#   article_read        — source read in-session, figures quoted from it
#   audit_sourced       — verified in the 2026-08-18 evidence audit (five
#                         refutation-first dispatches; primary source cited
#                         there). Trustworthy; re-pull before anchoring a
#                         POSITION on SEC/BLS/LBNL/ERCOT figures (audit's own
#                         403-fetch caveat).
#   search_summary      — from search-result synthesis; not read in full
#   unverified_background — model background knowledge, NOT re-verified; do
#                           not cite as evidence; upgrade before load-bearing use
#
# re_rating_status (audit implication #2): EV/EBITDA (or stated multiple)
# versus that name's OWN history — "constraint is real" and "market has
# already paid" are separate facts; this field keeps them separate.

meta:
  version: 2
  built_at: "2026-08-09"
  corrected_at: "2026-08-18"
  author: ai-stack-analyst
  review_cadence: quarterly (adversarial — search for the refutation first)

# ---------------------------------------------------------------------------
# MAP PURPOSE (replaces v1's migration_forecast — deleted 2026-08-18 per the
# audit: no forecasting machinery, no bottleneck-migration prediction. The
# map's job is STRUCTURAL: locate which layer is genuinely constrained,
# which is under-covered (rules.yml R3), and which is currently cold
# (rules.yml R1). Dated capacity-landing facts live inside their layers.)
# ---------------------------------------------------------------------------
map_purpose: >
  A structural locator, not a prediction engine. For each layer: is the
  constraint real (evidence, dated), has the market already paid
  (re_rating_status), is coverage thin (R3), is the name cold (R1)?
  Positions come only from theses that clear all four questions plus the
  keystone monitor.

# ---------------------------------------------------------------------------
# THE CALL — the field this object exists for
# ---------------------------------------------------------------------------
binding_constraint:
  current: >
    The electric-power DELIVERY chain, now as a compound of THREE confirmed
    sub-constraints that gate each other: (1) generation-equipment slots —
    global gas-turbine orders ~110 GW/yr vs 60-70 GW/yr manufacturing
    capacity, GE Vernova sold out through 2028; (2) grid interconnection —
    3-4 year queues in major markets, up to 7 years in Northern Virginia;
    (3) transformers/switchgear — 2-5 year lead times, BLS PPI +85.8% since
    Jan-2020 and still +4.1% YTD (audit_sourced). The v1 fourth leg —
    licensed electrical labor — is DOWNGRADED to UNPROVEN (see
    skilled_labor layer: BLS primary shows no crisis signature).
    Co-binding: DRAM wafer starts in aggregate, gated by advanced
    packaging (see those layers — the v1 "HBM is binding" call is stale).
  evidence_date: "2026-08-18 (v1 base 2026-07-16)"
  source: "TD Economics 'Bottlenecked' (article_read 2026-08-09) + 2026-08-18 evidence audit corrections (audit_sourced)"
  claim_status: article_read + audit_sourced
  demand_side_caveat: >
    The load-growth premise under the whole delivery chain took its first
    measured revision this month: 2026-08-11 EIA STEO cut Texas 2027
    electricity load growth from 14% to 6% after the 2026-08-03 Texas
    compliance pause; NERC reports ERCOT/PJM large loads "slowed or failed
    to materialize." Tracked by keystone-monitor.yml channel C — every
    thesis keyed to US datacentre load must survive that revision
    explicitly.
  consensus_dating:   # when did each become consensus vs when price moved
    power_bottleneck: "consensus ~2024; priced 2024-2026 (GEV / VRT / CEG / ETN re-rates). Constraint still DEEPENING on equipment (leads lengthened ~140→160+ weeks into 2026) — but see demand_side_caveat: the load forecast under it was cut for the first time 2026-08."
    memory: "consensus late-2025/H1-2026; priced violently H1-2026 (MU trailing P/E ~20 on peak-cycle EPS, then −39% drawdown). Late."
    electrical_labor: "entered mainstream coverage ~mid-2026 — but the underlying crisis claims are UNPROVEN on BLS primary (audit §1.3). What was 'partially priced scarcity' may be a priced story about an unproven scarcity."

# ---------------------------------------------------------------------------
# Layers (shovels -> bottlenecks). tightness: binding | co-binding | tight |
# easing | slack | unproven. priced: consensus_dating discipline.
# re_rating_status: multiple vs the name's/cohort's OWN history.
# ---------------------------------------------------------------------------
layers:
  - layer: compute_accelerators
    scope: GPUs / custom ASICs
    constraint_holders: [NVIDIA, AMD, hyperscaler-ASIC programs]
    tightness: easing
    note: "The 2022-23 binding constraint; no longer binding — power and memory gate deployments now. Hyperscaler capex $750-800B 2026 (+~76%) is being ABSORBED elsewhere in the stack."
    what_loosens: already loosened (CoWoS + HBM ramps, allocation maturity)
    evidence_date: "2026-08-09"
    claim_status: search_summary
    priced: fully (the consensus layer)
    re_rating_status: "NVDA market cap +23% at forward P/E 22.6 — the move is earnings-led, multiple modest vs own history (audit_sourced)"

  - layer: memory_hbm_dram
    scope: DRAM wafer starts in AGGREGATE (HBM + conventional DRAM)
    constraint_holders: [SK Hynix, Samsung, Micron]
    tightness: co-binding
    note: >
      v2 CORRECTION (audit §1.3): "HBM is binding" is STALE — the
      HBM3E-to-DDR5 price gap compressed from 4-5x to 1-2x and suppliers
      reallocated TOWARD DDR5. The binding item is DRAM wafer starts in
      aggregate; the 3:1 wafer-conversion cannibalization argument still
      holds but the scarce unit is the wafer start, not the HBM SKU.
    what_loosens: "greenfield DRAM fab capacity; demand break (capex decel)"
    evidence_date: "2026-08-18"
    claim_status: audit_sourced
    priced: "heavily (violent H1-2026 re-rate, now correcting — see dispositions: MU)"
    re_rating_status: "violent re-rate then partial unwind: MU ~20x TRAILING on peak-cycle EPS at the top, −39% drawdown since; suppliers SK Hynix +504%, SanDisk ~41x off its low (audit_sourced) — the cohort has been paid"

  - layer: advanced_packaging
    scope: CoWoS / SoIC / hybrid bonding
    constraint_holders: [TSMC, Amkor, ASE]
    tightness: binding — THE gate
    note: >
      v2 UPGRADE (audit §1.3): the only constraint candidate with a CEO on
      record — TSMC's C.C. Wei, Q2-2026 call (2026-07-16): "our packaging
      capacity is so tight that now it's limiting my customers' growth."
      v1 had this tight-but-easing on unverified background; the audit's
      primary sourcing reverses that.
    what_loosens: continued TSMC/OSAT capacity adds
    evidence_date: "2026-08-19"
    claim_status: audit_sourced (transcript cited in audit) + search_summary (2026-08-19 substrate figures)
    priced: "substantially (TSMC is the most-covered name on earth — R3: no coverage edge here)"
    re_rating_status: not_yet_measured (vs own history) — flagged for next quarterly pass
    sourcing_target_2026_08_19: >
      THIS LAYER IS THE NEXT SOURCING PASS (see
      2026-08-19-sourcing-pass-advanced-packaging.md). Two facts recorded
      together, deliberately: (1) CoWoS packaging capacity itself is
      EASING — ~35k wafers/month (late-2024) to ~120-140k (end-2026),
      supply-demand gap narrowing ~20% -> ~10%; (2) the SUBSTRATE/FILM
      chain feeding it is tight now — AI packages take 5-10x the ABF
      film of a PC chip at 14 layers rising toward 18, ~95% of the film
      is single-sourced against a ~+50% expansion through 2030, and
      Ibiden (the main AI-server substrate maker) says it has film
      secured for guidance but NOT for upside while committing ¥500bn
      over three years. The pass targets (2); it must NOT be written as
      a migration forecast from (1) to (2) — forecasting machinery stays
      banned. Expression is largely Japanese/Taiwanese mid-cap (EDINET /
      TDnet / TWSE MOPS doors), now reachable on IBKR; tier claim there
      is the neglected component ONLY (JP/TW are regional, not local).
      All figures are search_summary tier and must be re-pulled through
      the statutory doors before any thesis is written.

  - layer: networking_optics
    scope: 800G->1.6T optics, switching, DSPs
    constraint_holders: [Broadcom, Coherent, Lumentum, InnoLight-class]
    tightness: tight
    note: "1.6T transition underway; NOT researched in depth. Audit context: Lumentum +968%, AAOI +813% — the cohort has been paid violently."
    what_loosens: transceiver capacity ramps
    evidence_date: "2026-08-18"
    claim_status: audit_sourced (price moves) + unverified_background (constraint depth)
    priced: heavily
    re_rating_status: "supplier cohort +500-970% off lows (audit_sourced); vs-own-history multiples not yet measured"

  - layer: power_generation
    scope: gas turbines, nuclear PPAs, behind-the-meter
    constraint_holders: [GE Vernova, Siemens Energy, Mitsubishi Power; Constellation-class nuclear incumbents]
    tightness: binding
    note: >
      Turbine orders ~110 GW/yr vs 60-70 GW/yr capacity; GEV sold out
      through 2028. Behind-the-meter avoids the queue but not the
      equipment lead times. v2 CORRECTION (audit §4.1 cat.9): NUCLEAR IS
      NOT A RELIEF VALVE — realistic 3.6-6.2 GW online by end-2030 vs +34
      to +92 GW of DC load growth by 2028 (4-18% coverage); zero large
      reactors under US construction; Palisades (built, licensed) has
      slipped repeatedly with announced targets missed (Oct-2025 ->
      early-2026 -> still pre-startup at the Jul-2026 "watershed" release).
      The 2030 nuclear supply set is already closed.
    what_loosens: "manufacturing capacity adds (rationed to ~2029); demand break"
    evidence_date: "2026-08-18"
    claim_status: article_read (TD turbine figures) + audit_sourced (nuclear)
    priced: heavily (2024-25 re-rates)
    re_rating_status: "GEV: 66-92% of the equipment-cohort move is EARNINGS — forward multiple contracted 15% since Dec while implied forward EPS tripled (audit_sourced). Not a multiple bubble at the leader."

  - layer: transmission_interconnect
    scope: grid connection, HV lines, substations, permitting
    constraint_holders: [utilities, PJM/ERCOT/ISO queues, grid EPCs (Quanta-class)]
    tightness: binding
    note: >
      Queues 3-4yr (7yr NoVA); permitting = 29% of PJM milestone change
      requests; Q1-2026: 75 projects / $130B delayed or blocked. v2
      CORRECTION (audit §4.1 cat.6): HVDC CABLE IS A EUROPEAN TSO TRADE,
      NOT A US AI TRADE — NKT backlog >95% European TSOs (~70%
      interconnector / 30% offshore wind, datacentres not mentioned once);
      Nexans is subsea-driven. The datacentre money lands in TRANSFORMERS
      AND SWITCHGEAR (GE Vernova >$5bn DC orders YTD; Siemens Energy's
      growth is "the transformer business including data center projects").
      Demand-side caveat applies here first (ERCOT/PJM — see
      binding_constraint.demand_side_caveat).
    what_loosens: "FERC/state reform, co-location + behind-the-meter norms — SLOW"
    evidence_date: "2026-08-18"
    claim_status: article_read (TD queue figures) + audit_sourced (HVDC correction)
    priced: partially (utilities re-rated; the queue itself is not investable)
    re_rating_status: "regulated utilities NOT re-rated: AEP +5% over five years (audit §4 table); Quanta 39.5 fwd vs own 19.2-35.3 band = one of the two genuine multiple-risk names in the equipment cohort"

  - layer: transformers_switchgear
    scope: GSU + substation transformers, MV/LV switchgear, bus duct
    constraint_holders: [Hitachi Energy, Siemens Energy, Eaton, Hubbell, Powell-class specialists; GE Vernova/Prolec]
    tightness: binding
    note: >
      Unambiguously binding: BLS PPI +85.8% since Jan-2020, still +4.1%
      YTD; GEV paid $5.25bn CASH for Prolec GE; leads 2-5yr and lengthened
      into 2026 (~140->160+ wks). v2 CORRECTION (audit §4.1 cat.7): GOES
      (grain-oriented electrical steel) IS NOT THE BOTTLENECK — the
      near-sole US producer is loss-making (TTM −$876M), carries a Hold
      with a negative price target, and mentioned electrical steel zero
      times in two consecutive earnings releases; DOE rules from Jan-2029
      push toward AMORPHOUS steel. The market is paying for MANUFACTURING
      CAPACITY, not the steel input.
    what_loosens: "announced factory expansions landing 2027-28"
    evidence_date: "2026-08-18"
    claim_status: audit_sourced (PPI/Prolec/GOES) + article_read (TD lead times)
    priced: substantially (specialists re-rated hard 2024-25)
    re_rating_status: "mostly earnings-driven (see power_generation GEV note); genuine multiple risk narrow: Eaton 30.4 vs own 19.5-28.2 band (audit_sourced)"

  - layer: skilled_labor
    scope: licensed electricians, mechanical/commissioning crews, HV field talent
    constraint_holders: [IBEW/IEC pipelines; large E&M contractors (Comfort Systems, Emcor, IES-class); the licensure clock itself]
    tightness: UNPROVEN   # v2 DOWNGRADE from "binding — slowest legal unlock"
    note: >
      v2 CORRECTION (audit §1.3, 🔴): BLS PRIMARY SHOWS NO CRISIS
      SIGNATURE — 818,700 electricians, +9%/decade projected, ~81,000
      openings/yr, median $62,350. Every dramatic figure in circulation
      (>300K shortfall, $240-280K wages, the Brad Smith quote) is
      UNCONFIRMED. What remains factual: the 4-5yr licensure pipeline is
      law, and TD (article_read) reported ~30% of union electricians
      at/near retirement + 20-30% wage premiums — but the WAGE SERIES is
      the falsification test and it is not confirming. The BLS series is
      armed as a live invalidation trigger on theses/FIX.yml (T6).
      Counterforce: prefab/modular cuts on-site hours ~30%; hyperscaler
      self-perform fastest-growing (9.3% CAGR).
    what_loosens: "n/a until the constraint is PROVEN — the burden flipped"
    evidence_date: "2026-08-18"
    claim_status: audit_sourced (BLS) + article_read (TD retirement/premium figures, now contested)
    priced: "the STORY is priced (FIX ~5x off 52wk low, ~46x fwd vs 22.7x own median) — a priced story about an unproven scarcity is the worst quadrant"
    re_rating_status: "FIX ~46x fwd vs 22.7x five-year median own-history multiple — fully re-rated (theses/FIX.yml)"

  - layer: cooling
    scope: liquid/direct-to-chip, CDUs, thermal chain
    constraint_holders: [Vertiv-class, Boyd/CoolIT-class]
    tightness: tight
    note: >
      NOT re-verified in depth. Audit context: thermal hardware +119.8%
      over twelve months while the water expression of the identical
      physics (PHO −1.14%, FIW −0.78%) went nowhere — the water side is a
      DEFERRED opening (handoff §6), a question not a candidate; the
      non-obvious mechanism is closed-loop cooling RELOCATING water to the
      power plant at ~12x multiplier (indirect 4.52 L/kWh vs direct 0.36).
    what_loosens: capacity adds, standardization
    evidence_date: "2026-08-18"
    claim_status: audit_sourced (price context) + unverified_background (constraint depth)
    priced: heavily (2024-25 re-rates; +119.8% cohort move)
    re_rating_status: "thermal cohort heavily re-rated; water cohort NOT re-rated at all — the divergence is the §6 deferred question"

  - layer: dc_real_estate
    scope: powered shells, colo, hyperscale campuses
    constraint_holders: [Digital Realty/Equinix-class, private operators, POWERED-LAND holders]
    tightness: binding (as a derivative of power)
    note: >
      Vacancy record-low (6.7% from 8.3% on audit's operating sweep — v1's
      1.0-1.6% was a narrower series); 92% of under-construction
      pre-committed; leases-not-yet-commenced ~3.6x to ~$830B (audit
      operating-evidence sweep; v1 carried Moody's ~$662B early-2026).
      Record 9.6GW leasing; capacity reserved into 2028. The demand-
      rollover thesis FAILS on operating evidence and SUCCEEDS on
      financing (Amazon FCF −$11.6B, Oracle −$23.7B, Meta debt 4.2x to
      $112B, CoreWeave 10.3x debt/equity) — both facts carried.
    what_loosens: power delivery loosening upstream
    evidence_date: "2026-08-18"
    claim_status: audit_sourced
    priced: partially
    re_rating_status: "NEVER RE-RATED — DLR EV/EBITDA 28.97 (FY21) -> 28.88 (flat vs pre-ChatGPT), EQIX −23%, NextDC +2.6%, Goodman −13.5%, Keppel DC −3.0% (audit §4 table). The §6 deferred 'ownership layer' question lives here: possibly correct pricing for commoditised asset ownership whose tenants hold the pricing power. UPDATE 2026-08-19: this layer now carries the RESIDUE OF BOTH deferred questions — the never-re-rated owners AND the water-relocation mechanism (power-plant cooling at ~12x the direct draw is a cost/siting input of the owner-utility stack; the water question closed 2026-08-18 as 'real mechanism, no neglected listed expression' — spot-check scope, n~1). The question RE-OPENED as expressible: NXT.AX / GMG.AX / Keppel DC are screenable under the 2026-08-19 listing decision (rules.yml sourcing.listing_scope), mechanism-first as always."

  - layer: foundry_semicap
    scope: leading-edge logic capacity + wafer-fab equipment
    constraint_holders: [TSMC; ASML/AMAT/LRCX/KLA-class]
    tightness: slack-to-tight
    note: >
      Leading-edge logic is not the 2026 gate (power, memory, packaging
      are). v2 CORRECTION (audit §1.3): LITHO IS EXPLICITLY NOT A GATE —
      ASML adding +30% EUV capacity two years running with substantially
      all 2027 orders already in hand.
    what_loosens: n/a
    evidence_date: "2026-08-18"
    claim_status: audit_sourced
    priced: n/a
    re_rating_status: not_yet_measured

  - layer: eda_ip
    scope: chip design software + IP
    constraint_holders: [Synopsys, Cadence, Arm]
    tightness: slack (structural toll, never the queue)
    note: "Value capture without constraint-holding; not a bottleneck play."
    evidence_date: null
    claim_status: unverified_background
    priced: fully
    re_rating_status: not_yet_measured

  - layer: model_labs_applications
    scope: frontier labs + application layer
    constraint_holders: [capital access + compute allocations]
    tightness: n/a
    note: >
      Mostly private / not investable as constraint-holders; the $700-770B
      capex row is their spend. THE KEYSTONE LAYER: disclosed AI revenue
      ~$142B vs that capex; Bain $2T-by-2030 with $800B shortfall; the
      enterprise-software monetisation layer is being taken apart (CRM
      EV/S 8.61->4.37, NOW −32.1%, ADBE −28.4% at fwd 9.8, HUBS −51.0%).
      Tracked at portfolio level by keystone-monitor.yml — per-thesis
      triggers cannot catch this common mode.
    evidence_date: "2026-08-18"
    claim_status: audit_sourced
    priced: n/a
    re_rating_status: "monetisation basket de-rated 20-51% — the leading indicator already moved (keystone-monitor.yml channel B)"

  - layer: physical_inputs
    scope: gallium, copper (mine-level), gas supply, gensets, water
    constraint_holders: [diffuse]
    tightness: tight (spot disruptions; mine-level copper)
    note: >
      v2 CORRECTIONS (audit §4.1 cat.5+8): (a) RARE EARTHS ARE NOT A
      DATACENTRE THESIS — USGS end-uses do not list datacentres; the only
      direct content is HDD voice-coil motors, being displaced by SSDs
      which contain none; no kg-per-MW figure exists anywhere searched
      (the absence IS the finding). Sm/Gd/Tb/Dy restricted elements serve
      defence, EV traction, direct-drive wind — different thesis, wrong
      securities here. (b) The datacentre-relevant critical mineral is
      GALLIUM — IEA: >10% of today's supply consumed by datacentres by
      2030, China ~99% of refined supply. (c) COPPER IS BINDING AT THE
      MINE ONLY — concentrate −3.4%, mine utilisation 76.6%, Grasberg −65%
      YoY, BUT refined metal in SURPLUS (+96kt 2026, +377kt 2027 forecast)
      at 23-year-high exchange stocks with ~7Mt idle smelting capacity;
      datacentres ~2.5% of copper demand on the only published sizing,
      which predates the AI boom. TD's helium/sulfuric-acid/genset flags
      stand (article_read).
    what_loosens: diffuse — per-input
    evidence_date: "2026-08-18"
    claim_status: audit_sourced + article_read (TD)
    priced: unknown (gallium exposure barely investable ex-China; copper equities price the refined surplus, not the mine deficit)
    re_rating_status: not_yet_measured
